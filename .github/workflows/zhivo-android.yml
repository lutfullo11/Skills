name: Живо · Android APK
on:
  push:
    paths:
      - 'zhivo/**'
      - '.github/workflows/zhivo-android.yml'
  workflow_dispatch:
env:
  ZHIVO_DEBUG_KEYSTORE: ${{ github.workspace }}/zhivo/.ci/debug.keystore
permissions:
  contents: read
concurrency:
  group: zhivo-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup:
    name: Stop obsolete runs for this branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel only older Живо runs on the same branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZHIVO_BRANCH: ${{ github.ref_name }}
        run: |
          gh api "repos/$GH_REPO/actions/runs?per_page=100" | jq -r --arg branch "$ZHIVO_BRANCH" --argjson current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.path == ".github/workflows/zhivo-android.yml" and .head_branch == $branch and .id < $current and .status != "completed") | .id' > /tmp/zhivo-obsolete-runs
          while read -r old_run; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$old_run/force-cancel" || gh api --method POST "repos/$GH_REPO/actions/runs/$old_run/cancel" || true
          done < /tmp/zhivo-obsolete-runs
  build:
    name: Tests, lint and debug APK
    needs: cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zhivo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-read-only: false
      - name: Reuse debug signing key when available
        uses: actions/cache@v4
        with:
          path: ${{ env.ZHIVO_DEBUG_KEYSTORE }}
          key: zhivo-debug-keystore-v2-${{ github.repository }}
      - name: Create debug key only on cache miss
        run: |
          mkdir -p .ci
          if [ ! -f "$ZHIVO_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$ZHIVO_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Check authored content matches packaged course
        run: python3 scripts/build_course.py --check
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Verify installable APK and 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/check_apk.py app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Zhivo-1.0-debug.apk
          sha256sum dist/Zhivo-1.0-debug.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Zhivo-debug-APK
          path: zhivo/dist/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zhivo-check-reports
          path: |
            zhivo/app/build/reports/
            zhivo/app/build/test-results/
          retention-days: 30
  android16:
    name: Android 16 UI and SQLite tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.ZHIVO_DEBUG_KEYSTORE }}
          key: zhivo-debug-keystore-v2-${{ github.repository }}
          fail-on-cache-miss: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            cd zhivo && bash scripts/device_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zhivo-Android16-tests
          path: |
            zhivo/app/build/reports/androidTests/
            zhivo/app/build/outputs/androidTest-results/
            zhivo/device-captures/
          retention-days: 30
